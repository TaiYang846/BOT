<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>對話紀錄編輯器</title>
<style>
:root{--bg:#17181c;--panel:#212227;--line:#33353c;--tx:#e8e9ec;--mute:#8b8f9a;--acc:#5865f2;--acc2:#6d79f5}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.bar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.bar h1{font-size:15px;margin:0 8px 0 0;font-weight:700;letter-spacing:.02em}
.sep{width:1px;height:22px;background:var(--line)}
.grp{display:flex;gap:4px;align-items:center}
select{font:inherit;color:var(--tx);background:#2b2d34;border:1px solid var(--line);border-radius:6px;padding:5px 6px}
button{font:inherit;color:var(--tx);background:#2b2d34;border:1px solid var(--line);border-radius:6px;padding:5px 11px;cursor:pointer}
button:hover:not(:disabled){background:#363942}
button:disabled{opacity:.4;cursor:default}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.pri:hover:not(:disabled){background:var(--acc2)}
.seg button{border-radius:0;margin:0}
.seg button:first-child{border-radius:6px 0 0 6px}
.seg button:last-child{border-radius:0 6px 6px 0;border-left:0}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.sp{flex:1}
#status{color:var(--mute);font-size:12px}
.stage{flex:1;position:relative;min-height:0}
#frame{width:100%;height:100%;border:0;display:none;background:#000}
#empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px}
#empty .box{border:2px dashed #3d4049;border-radius:14px;padding:44px 56px;max-width:480px}
#empty.over .box{border-color:var(--acc);background:rgba(88,101,242,.08)}
#empty h2{margin:0 0 6px;font-size:18px}
#empty p{margin:4px 0;color:var(--mute)}
.stage{display:flex}
.view{flex:1;position:relative;min-width:0}
#tocPanel{width:310px;flex-shrink:0;background:var(--panel);border-left:1px solid var(--line);display:none;flex-direction:column;min-height:0}
#tocPanel.open{display:flex}
#tocPanel header{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
#tocPanel h3{margin:0;font-size:14px;display:flex;justify-content:space-between;align-items:center}
#tocPanel .mini{display:flex;gap:6px;flex-wrap:wrap}
#tocPanel .mini button{font-size:12px;padding:3px 8px}
#tocList{flex:1;overflow:auto;padding:8px}
.titem{display:flex;align-items:center;gap:4px;margin-bottom:6px}
.titem .n{width:22px;text-align:right;color:var(--mute);font-size:12px;flex-shrink:0}
.titem input{flex:1;min-width:0;background:#17181c;border:1px solid var(--line);border-radius:5px;color:var(--tx);padding:5px 7px;font:inherit}
.titem input:focus{outline:2px solid var(--acc);border-color:transparent}
.titem button{padding:3px 7px;font-size:12px}
.tempty{color:var(--mute);font-size:12.5px;padding:6px 4px;line-height:1.6}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50}
.ov.open{display:flex}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px 22px;width:min(400px,92vw);display:flex;flex-direction:column;gap:14px}
.dlg h3{margin:0;font-size:16px}
.dlg .opt{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dlg label.chk{display:flex;gap:8px;align-items:center;cursor:pointer}
.dlg label.chk.dis{opacity:.45;cursor:default}
.dlg .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.dlg p{margin:0;color:var(--mute);font-size:13px}
.implist{max-height:210px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.improw{padding:7px 10px;border-bottom:1px solid var(--line);font-size:13px}
.improw:last-child{border-bottom:0}
.improw small{display:block;color:var(--mute);font-size:12px}
.improw.bad{color:#f0777a}
.avprev{width:64px;height:64px;border-radius:50%;object-fit:cover;align-self:center}
.fbar{padding:6px 14px;background:#1c1d21}
.flabel{color:var(--mute);font-size:12px}
.syn{margin-left:5px;color:var(--mute);font:11px ui-monospace,Consolas,monospace}
.fbar button{padding:4px 9px}
.tip{font-size:12px;color:var(--mute);padding:5px 14px;background:#1c1d21;border-bottom:1px solid var(--line);display:none}
</style>
</head>
<body>
<div class="bar">
  <h1>對話紀錄編輯器</h1>
  <div class="grp">
    <button id="btnOpen" title="可一次選多個檔案，會合併成一份">開啟檔案</button>
    <button id="btnAdd" disabled title="把其他 HTML 加進目前這份">＋加入檔案</button>
    <button id="btnAddMsg" disabled title="在目前選到的那則後面新增一則對話（沒選就加在最後）">＋新增對話</button>
    <button id="btnAddDiv" disabled title="新增一條可以打字的分隔線，例如「case1 - 『悟君』」">＋文字分隔線</button>
    <button id="btnSort" disabled title="依每則的時間重新排序，並重建日期分隔線">↕ 依時間排序</button>
    <select id="cutoff" title="日期分隔線幾點換日：凌晨的訊息會算在前一天底下（你的原檔就是這樣分的）">
      <option value="0">換日 00:00</option><option value="3">換日 03:00</option><option value="4">換日 04:00</option>
      <option value="5" selected>換日 05:00</option><option value="6">換日 06:00</option><option value="8">換日 08:00</option>
    </select>
  </div>
  <div class="grp" id="selInfo" style="display:none">
    <span style="color:#9fb0ff;font-size:13px">已選 <b id="selN">0</b> 則（可一起拖曳）</span>
    <button id="selClear">取消選取</button><button id="selDel">刪除所選</button>
  </div>
  <div class="sep"></div>
  <div class="grp seg" title="只影響編輯時的檢視；匯出時可另外選底色">
    <button id="thDark" class="on">黑底</button><button id="thLight">白底</button>
  </div>
  <div class="sep"></div>
  <div class="grp">
    <button id="btnUndo" title="復原上一個移動／刪除／複製" disabled>↶ 復原</button>
  </div>
  <div class="sep"></div>
  <div class="grp seg">
    <button id="mEdit" class="on">編輯</button><button id="mView">預覽</button>
  </div>
  <div class="grp"><button id="btnToc">☰ 目錄 (0)</button></div>
  <div class="sp"></div>
  <span id="status">尚未載入檔案</span>
  <button id="btnExport" class="pri" disabled>匯出 HTML</button>
  <input type="file" id="file" accept=".html,.htm,text/html" multiple hidden>
  <input type="file" id="fileAdd" accept=".html,.htm,text/html" multiple hidden>
</div>
<div class="bar fbar" id="fbar">
  <span class="flabel">Discord 格式</span>
  <div class="grp">
    <button id="btnB" title="粗體 **文字**（Ctrl+B）"><b>B</b></button>
    <button id="btnI" title="斜體 *文字*（Ctrl+I）"><i>I</i></button>
    <button data-f="u" title="底線 __文字__（先選取文字）"><u>U</u><small class="syn">__</small></button>
    <button data-f="s" title="刪除線 ~~文字~~（先選取文字）"><s>S</s><small class="syn">~~</small></button>
    <button data-f="spoiler" title="劇透 ||文字||（先選取文字；匯出後點一下才會顯示）">劇透<small class="syn">||</small></button>
  </div>
  <div class="sep"></div>
  <div class="grp">
    <button data-f="h1" title="大標題：把這一行變成 # 大標題（再按一次取消）"><b>大標題</b><small class="syn">#</small></button>
    <button data-f="h2" title="中標題：## "><b>中標題</b><small class="syn">##</small></button>
    <button data-f="h3" title="小標題：### "><b>小標題</b><small class="syn">###</small></button>
    <button data-f="sub" title="副標：-# （小字灰色）">副標<small class="syn">-#</small></button>
  </div>
  <div class="sep"></div>
  <div class="grp">
    <button data-f="qt" title="引用這一行：> ">引用一行<small class="syn">&gt;</small></button>
    <button data-f="qtb" title="引用整段：>>> （選取多行；沒選取就是從這一行到訊息結尾）">引用整段<small class="syn">&gt;&gt;&gt;</small></button>
  </div>
  <div class="sep"></div>
  <div class="grp">
    <button data-f="code" title="行內程式碼：先選取文字">程式碼<small class="syn">`</small></button>
    <button data-f="pre" title="程式碼區塊：把選取的行（或這一行）變成區塊">程式碼區塊<small class="syn">```</small></button>
  </div>
  <div class="sep"></div>
  <div class="grp">
    <button data-f="ul" title="項目清單：- 或 * （選取多行，每行一個項目）">• 清單<small class="syn">-</small></button>
    <button data-f="ol" title="編號清單：1. 2. 3.（選取多行，每行一個項目）">1. 清單<small class="syn">1.</small></button>
  </div>
  <div class="sep"></div>
  <div class="grp">
    <button data-f="link" title="連結：[文字](網址)。選取文字後按下，輸入網址；在連結上再按可修改或移除">連結<small class="syn">[ ]( )</small></button>
    <button data-f="mention" title="@提及：選取名字，或直接輸入名字">@提及</button>
    <button data-f="ch" title="#頻道提及：選取名字，或直接輸入名字">#頻道</button>
  </div>
  <div class="sep"></div>
  <div class="grp"><button data-f="clear" title="清除所在這一行（或選取的幾行）的所有格式">清除格式</button></div>
  <span class="flabel" style="margin-left:auto">先點進訊息文字 → 按按鈕；再按一次可取消</span>
</div>
<div class="tip" id="tip">拖曳左側 ⠿ 移動　·　可一次開啟多個檔案合併　·　點頭像換圖　·　滑鼠移到訊息上有 目錄／複製／刪除　·　點文字直接修改，Enter 換行　·　Ctrl+S 匯出</div>
<div class="stage">
 <div class="view">
  <div id="empty">
    <div class="box">
      <h2>把匯出的 HTML 拖進來</h2>
      <p>或按左上角「開啟檔案」</p>
      <p>圖片、頭像都會原樣保留在檔案裡</p>
    </div>
  </div>
  <iframe id="frame" title="對話紀錄"></iframe>
 </div>
 <aside id="tocPanel">
  <header>
    <h3><span>目錄編輯</span><button id="tocClose" style="padding:2px 8px">✕</button></h3>
    <div class="mini">
      <button id="tocDates">加入所有日期分隔線</button>
      <button id="tocClear">清空目錄</button>
    </div>
  </header>
  <div id="tocList"></div>
 </aside>
</div>

<input type="file" id="avFile" accept="image/*" hidden>

<div class="ov" id="ovImp"><div class="dlg" style="width:min(540px,94vw)">
  <h3 id="impTitle">載入檔案</h3>
  <div id="impList" class="implist"></div>
  <div id="impMode" style="display:none;flex-direction:column;gap:6px">
    <label class="chk"><input type="radio" name="impm" value="add" checked> 加入目前這份</label>
    <label class="chk"><input type="radio" name="impm" value="replace"> 取代目前內容</label>
  </div>
  <label class="chk"><input type="checkbox" id="impSort" checked> <span id="impSortTxt">依時間排序，並重新產生日期分隔線</span></label>
  <label class="chk"><input type="checkbox" id="impDup" checked> 移除重複的訊息（同角色、同時間、同內容）</label>
  <div class="acts"><button id="impCancel">取消</button><button class="pri" id="impGo">載入</button></div>
</div></div>

<div class="ov" id="ovExport"><div class="dlg">
  <h3>匯出設定</h3>
  <div class="opt"><span>網頁標題</span>
    <input id="exPageTitle" placeholder="瀏覽器分頁上顯示的標題" style="width:240px;background:#17181c;border:1px solid var(--line);border-radius:6px;color:var(--tx);padding:5px 7px;font:inherit"></div>
  <div class="opt"><span>預設底色</span>
    <div class="grp seg"><button id="exDark" class="on">黑底</button><button id="exLight">白底</button></div></div>
  <label class="chk"><input type="checkbox" id="exViewer" checked> 加上「日間／夜間模式」切換鈕（看的人可自己選）</label>
  <label class="chk"><input type="checkbox" id="exBot" checked> 保留 BOT 標籤</label>
  <div id="exChOpts" style="display:flex;flex-direction:column;gap:8px">
    <label class="chk"><input type="checkbox" id="exCh" checked> 附上頻道切換鈕（讓看的人選擇要看哪個頻道）</label>
    <div class="opt" id="exChTxt"><span>按鈕／視窗標題文字</span><span class="grp">
      <input id="exChBtn" style="width:90px;background:#17181c;border:1px solid var(--line);border-radius:6px;color:var(--tx);padding:5px 7px;font:inherit">
      <input id="exChTitle" style="width:130px;background:#17181c;border:1px solid var(--line);border-radius:6px;color:var(--tx);padding:5px 7px;font:inherit"></span></div>
  </div>
  <label class="chk" id="exChanLbl"><input type="checkbox" id="exChan" checked> 保留每則訊息旁的頻道名稱</label>
  <label class="chk" id="exTocLbl"><input type="checkbox" id="exToc"> 附上目錄（<span id="exTocN">0</span> 個章節）</label>
  <div class="opt" id="exTocOpts"><span>目錄樣式</span>
    <span class="grp">
      <select id="exMarker"><option value="none">無列點</option><option value="dot">圓點 ●</option><option value="dash">短橫線 –</option><option value="num">數字 1 2 3</option></select>
      <input id="exTocTitle" placeholder="按鈕文字" style="width:90px;background:#17181c;border:1px solid var(--line);border-radius:6px;color:var(--tx);padding:5px 7px;font:inherit">
    </span></div>
  <div class="acts"><button id="exCancel">取消</button><button class="pri" id="exGo">匯出</button></div>
</div></div>

<div class="ov" id="ovAv"><div class="dlg">
  <h3>更換頭像</h3>
  <img class="avprev" id="avPrev" alt="">
  <p id="avWho"></p>
  <div class="acts" style="flex-direction:column;align-items:stretch">
    <button class="pri" id="avAll"></button>
    <button id="avOne">只換這一則</button>
    <button id="avCancel">取消</button>
  </div>
</div></div>

<script>
const $ = s => document.querySelector(s);
const frame = $('#frame');
let idoc = null, baseCSS = '', savedScripts = [], fileName = 'chat.html';
let theme = 'dark', editing = true, dirty = false;
const undoStack = [];
let exOpts = { chfab: true, chBtn: '表示切替', chTitle: 'チャット種類一覧', theme: null, bot: true, toc: true, viewer: true, marker: 'none', tocTitle: '目錄', chan: true };
let pendingAv = null;

const TOPBAR_CSS = pos => pos !== 'topbar' ? '' : `.topbar{position:fixed;top:14px;right:16px;z-index:12;display:flex;gap:8px;align-items:flex-start}
.topbar .vbar button,.topbar .toc summary{line-height:20px;font-size:13px;box-sizing:content-box}
`;
const CDIV_CSS = '\n/*cdiv*/.custom-divider.cd-empty{gap:0}/*endcdiv*/\n';   // 沒打字的文字分隔線：中間不留空隙，變成一條完整的線
const vbarCss = (pos, off = 16) => `/*vbar*/
${TOPBAR_CSS(pos)}
.vbar{${pos === 'topbar' ? '' : 'position:fixed;' + (pos === 'bottom' ? 'bottom:' + off + 'px' : 'top:14px') + ';right:16px;'}z-index:12}
.vbar button{font:inherit;font-size:13px;cursor:pointer;background:#313338;color:#dbdee1;border:1px solid #3a3c43;border-radius:8px;padding:6px 12px}
.vbar button:hover{background:#2e3035}
/*endvbar*/`;
const CHFAB_CSS = `/*chfab*/
#ch-fab{position:fixed;bottom:16px;right:16px;z-index:12}
#ch-btn{font:inherit;font-size:14px;font-weight:700;color:#fff;background:#2563eb;border:0;border-radius:999px;padding:12px 22px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.4)}
#ch-btn:hover{background:#1d4fd8}
#ch-pop{position:fixed;bottom:72px;right:16px;z-index:13;width:min(340px,calc(100vw - 32px));background:#fff;color:#1e293b;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.45);overflow:hidden}
#ch-pop[hidden]{display:none}
#ch-pop .ch-hd{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:#f8fafc;border-bottom:1px solid #e2e8f0;font-weight:700;color:#64748b;font-size:14px}
#ch-pop .ch-x{font:inherit;font-size:20px;line-height:1;color:#64748b;background:none;border:0;cursor:pointer;padding:0 2px}
#ch-pop .ch-list{padding:14px 18px 18px;max-height:50vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
#ch-pop label{display:flex;align-items:center;gap:12px;cursor:pointer;font-size:15px;color:#1e293b}
#ch-pop input{width:20px;height:20px;accent-color:#2563eb;flex-shrink:0;margin:0}
#filter-empty{text-align:center;color:#949ba4;padding:48px 16px}
/*endchfab*/`;
const SPOILER_JS = `document.addEventListener('click',function(e){var s=e.target.closest&&e.target.closest('.spoiler');if(s)s.classList.toggle('revealed')});`;
const CHANNEL_JS = `(function(){var btn=document.getElementById('ch-btn'),pop=document.getElementById('ch-pop');if(!btn||!pop)return;
var opts=[].slice.call(pop.querySelectorAll('input[data-channel]')),entries=[].slice.call(document.querySelectorAll('.chat-log [data-channel]')),dates=[].slice.call(document.querySelectorAll('.date-divider[data-date]')),empty=document.getElementById('filter-empty');
function update(){var sel={},vd={},vis=0;opts.forEach(function(o){if(o.checked)sel[o.getAttribute('data-channel')]=1});
entries.forEach(function(e){var show=!!sel[e.getAttribute('data-channel')];e.hidden=!show;if(show){vis++;vd[e.getAttribute('data-date')]=1}});
dates.forEach(function(d){d.hidden=!vd[d.getAttribute('data-date')]});if(empty)empty.hidden=vis!==0;}
btn.addEventListener('click',function(){pop.hidden=!pop.hidden});
document.getElementById('ch-x').addEventListener('click',function(){pop.hidden=true});
document.addEventListener('click',function(e){if(!pop.hidden&&!pop.contains(e.target)&&e.target!==btn)pop.hidden=true});
opts.forEach(function(o){o.addEventListener('change',update)});update();})();`;
const VIEWER_JS = `(function(){var l=document.getElementById('theme-light'),b=document.getElementById('theme-btn');if(!l||!b)return;var K='chat-theme:'+document.title;
function set(x){l.media=x?'all':'not all';b.textContent=x?'🌙 夜間模式':'☀ 日間模式';}
var v=null;try{v=localStorage.getItem(K)}catch(e){}
set(v?v==='light':l.media==='all');
b.onclick=function(){var x=l.media!=='all';set(x);try{localStorage.setItem(K,x?'light':'dark')}catch(e){}};})();`;
const tocCss = (pos, h, off = 64) => `/*toc*/
${TOPBAR_CSS(pos)}html{scroll-behavior:smooth}
[data-toc]{scroll-margin-top:${h}px}
.toc{${pos === 'topbar' ? 'position:relative;' : 'position:fixed;' + (pos === 'bottom' ? 'bottom:' + off + 'px' : 'top:64px') + ';right:16px;'}z-index:11;font-size:13px;text-align:right}
.toc summary{list-style:none;cursor:pointer;display:inline-block;background:#2b2d31;color:#f2f3f5;border:1px solid #3a3c43;border-radius:6px;padding:6px 12px;font-weight:600}
.toc summary::-webkit-details-marker{display:none}
.toc ul{${pos === 'topbar' ? 'position:absolute;right:0;top:calc(100% + 6px);margin:0;max-height:70vh;' : pos === 'bottom' ? 'position:absolute;right:0;bottom:calc(100% + 6px);max-height:60vh;' : 'margin-top:6px;max-height:70vh;'}background:#2b2d31;border:1px solid #3a3c43;border-radius:8px;padding:8px 12px;list-style:none;overflow:auto;min-width:220px;max-width:min(320px,80vw);text-align:left}
.toc ul.m-num{list-style:decimal;padding-left:32px}
.toc ul.m-dot{list-style:disc;padding-left:30px}
.toc ul.m-dash{list-style:"– ";padding-left:26px}
.toc li.lv1{margin-left:16px;font-size:.95em}
.toc li.lv2{margin-left:32px;font-size:.9em}
.toc li.lv1 a,.toc li.lv2 a{color:#949ba4}
.toc li{margin:4px 0}
.toc a{color:#dbdee1;text-decoration:none}

/* ---------- 時間解析 ---------- */
const TS_RE = /(\d{4})-(\d{2})-(\d{2})[ T](\d{1,2}):(\d{2})(?::(\d{2}))?/;
const DATE_RE = /(\d{4})年\s*(\d{1,2})月\s*(\d{1,2})日/;
function stampOf(u, f = F){
  const el = u.querySelector(f.ts);
  const m = el && TS_RE.exec(el.textContent);
  if (!m) return null;
  return { t: Date.UTC(+m[1], m[2] - 1, +m[3], +m[4], +m[5], +(m[6] || 0)), key: `${m[1]}-${m[2]}-${m[3]}`, s: m[0] };
}
function dividerKey(u){
  if (u.classList.contains('custom-divider')) return null;       // 自訂文字分隔線不參與日期排序
  const a = u.getAttribute('data-date');
  if (a && /^\d{4}-\d\d-\d\d$/.test(a)) return a;
  const m = DATE_RE.exec(u.textContent);
  return m ? `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}` : null;
}
let srcCounter = 0, note = '';
const dayCutoff = () => +$('#cutoff').value || 0;

/* ---------- 頭像資料（新版格式：頭像以 CSS class 引用，每張只存一次） ---------- */
function parseAvatars(doc){
  const m = new Map(), st = doc.querySelector('#avatar-assets');
  if (!st) return m;
  const re = /\.(avatar-image-\d+)\s*\{\s*background-image:\s*url\((["']?)([\s\S]*?)\2\)\s*;?\s*\}/g;
  let x; const text = st.textContent;
  while ((x = re.exec(text))) m.set(x[1], x[3]);
  return m;
}
const avatarRules = used => [...avatars].filter(([c]) => !used || used.has(c)).map(([c, u]) => `.${c} {\n  background-image: url("${u}");\n}\n`).join('\n');
function avatarClassFor(url){
  for (const [c, u] of avatars) if (u === url) return c;
  let n = 0; avatars.forEach((_, c) => { n = Math.max(n, +c.replace(/\D/g, '')); });
  const c = 'avatar-image-' + String(n + 1).padStart(3, '0');
  avatars.set(c, url); return c;
}
function syncAvatarStyle(){
  let el = idoc.getElementById('avatar-assets');
  if (!el){ el = idoc.createElement('style'); el.id = 'avatar-assets'; idoc.head.appendChild(el); }
  el.textContent = '\n' + avatarRules() + '\n';
}

/* ---------- 頻道（新版格式） ---------- */
function collectChannelLabels(doc, into){
  doc.querySelectorAll('#channel-filters input[data-channel], #ch-pop input[data-channel]').forEach(i => {
    const t = (i.closest('label') || i.parentNode).textContent.trim().replace(/（\d+）$/, '');
    if (t && !into.has(i.getAttribute('data-channel'))) into.set(i.getAttribute('data-channel'), t);
  });
}
function stripChannelUI(doc){
  doc.querySelectorAll('#channel-filters, #ch-fab, #ch-pop, #filter-empty').forEach(n => n.remove());
  const hdr = doc.querySelector('.page-header');
  if (hdr) [...hdr.children].forEach(c => { if (c.tagName === 'DIV' && !c.id && /～/.test(c.textContent)) c.remove(); });
}

/* ---------- 讀檔 ---------- */
function detectFormat(doc){
  if (doc.querySelector('.chat-log')) return FORMATS.neu;
  if (doc.querySelector('.wrap')) return FORMATS.old;
  return null;
}
async function parseFile(file){
  const info = { file, name: file.name || 'chat.html', ok: false };
  try {
    const text = await file.text();
    const doc = new DOMParser().parseFromString(text, 'text/html');
    const f = detectFormat(doc);
    if (!f) return info;
    const wrap = doc.querySelector(f.wrap);
    info.F = f; info.doc = doc; info.ok = true;
    info.count = wrap.querySelectorAll(':scope > ' + f.msg).length;
    let lo = null, hi = null;
    [...wrap.children].forEach(u => {
      if (u.matches(f.div)) return;
      const st = stampOf(u, f); if (!st) return;
      if (!lo || st.t < lo.t) lo = st;
      if (!hi || st.t > hi.t) hi = st;
    });
    info.t0 = lo ? lo.t : Infinity; info.range = lo ? `${lo.s} → ${hi.s}` : '（找不到時間）';
  } catch (e) {}
  return info;
}

// 把一份已解析的檔案當作「底稿」載入（取代目前內容）
function loadFresh(info){
  const doc = info.doc;
  setFormat(info.F);
  avatars = parseAvatars(doc);
  const st = doc.querySelector('style#page-styles, style#theme-style') || doc.querySelector('style');
  origStyleId = (st && st.id && st.id !== 'theme-style') ? st.id : '';
  const css = (st ? st.textContent : '').replace(/\/\*toc\*\/[\s\S]*?\/\*endtoc\*\//, '').replace(/\/\*vbar\*\/[\s\S]*?\/\*endvbar\*\//, '').replace(/\/\*chfab\*\/[\s\S]*?\/\*endchfab\*\//, '').replace(/\/\*cdiv\*\/[\s\S]*?\/\*endcdiv\*\//, '');
  // 之前匯出、帶有日夜切換的檔案：深色在 #theme-style（或原本的 id）、淺色在 #theme-light
  const ls = doc.querySelector('#theme-light');
  const lsDefaultLight = ls ? ls.getAttribute('media') === 'all' : null;
  if (ls) ls.remove();
  doc.querySelectorAll('.vbar, details.toc, .topbar').forEach(n => n.remove());
  const isLight = lsDefaultLight !== null ? lsDefaultLight : /body\s*\{[^}]*background:\s*#ffffff/i.test(css);
  baseCSS = ((lsDefaultLight === null && isLight) ? remap(css, INV) : css) + CDIV_CSS;
  exOpts.theme = null;
  theme = isLight ? 'light' : 'dark';
  if (st){ st.id = 'theme-style'; st.textContent = themeCSS(theme); }

  // 編輯時先拿掉 script，匯出時再放回去
  savedScripts = [];
  doc.querySelectorAll('script').forEach(s => {
    // 日夜切換、頻道篩選的 script 會在匯出時重新產生；原本和它們寫在同一支 script 裡的圖片放大功能要留下來
    if (s.id === 'theme-script' || s.id === 'channel-script' || s.id === 'spoiler-script'){ s.remove(); return; }
    const t = s.textContent;
    if (/channel-filters|filterPanel/.test(t)){
      let j = t.indexOf('// 篩選'); if (j < 0) j = t.indexOf('const filterPanel');
      const keep = j > 0 ? t.slice(0, j).trim() : '';
      if (keep) savedScripts.push('<script>\n' + keep + '\n<\/script>');
    } else savedScripts.push(s.outerHTML);
    s.remove();
  });
  channelLabels = new Map();
  if (F.name === 'new'){ collectChannelLabels(doc, channelLabels); stripChannelUI(doc); }
  doc.querySelectorAll(`${F.wrap} > [id^="ch-"]`).forEach(n => n.removeAttribute('id'));

  fileName = info.name;
  pageTitle = (doc.title || '').trim();
  const html = '<!DOCTYPE html>' + doc.documentElement.outerHTML;

  frame.style.display = 'block';
  $('#empty').style.display = 'none';
  idoc = frame.contentDocument;
  idoc.open(); idoc.write(html); idoc.close();
  srcCounter = 0; note = '';
  setupEditor();
  undoStack.length = 0; dirty = false; renderToc(); refreshUI();
}

const dupKey = u => {
  if (u.id && /^message-/.test(u.id)) return 'id:' + u.id;      // 新版格式：訊息有唯一 id
  if (u.matches(F.msg)){
    const st = stampOf(u), bd = u.querySelector('.bd,.message-body'); if (!st || !bd) return null;
    return `${((u.querySelector(F.nm) || {}).textContent || '').trim()}|${st.s}|${bd.textContent}|${bd.querySelectorAll('img').length}`;
  }
  return null;
};

// 把其他檔案的內容加進目前這份
function mergeInfos(infos, opts){
  const wrap = idoc.querySelector(F.wrap);
  const before = [...wrap.children];
  const seen = new Set();
  if (opts.dedupe) before.forEach(u => { const k = dupKey(u); if (k) seen.add(k); });
  let added = 0, skipped = 0;
  infos.forEach(info => {
    const src = ++srcCounter;
    const theirs = F.name === 'new' ? parseAvatars(info.doc) : null;
    if (F.name === 'new') collectChannelLabels(info.doc, channelLabels);
    const clsMap = new Map();     // 對方的頭像 class -> 我們這份裡的 class
    [...info.doc.querySelector(F.wrap).children].forEach(u => {
      if (opts.dedupe){
        const k = dupKey(u);
        if (k){ if (seen.has(k)){ skipped++; return; } seen.add(k); }
      }
      const n = idoc.importNode(u, true);
      n.__src = src;
      if (/^ch-\d+$/.test(n.id)) n.removeAttribute('id');
      if (theirs){
        n.querySelectorAll(':scope > .avatar').forEach(a => {
          const c = [...a.classList].find(x => /^avatar-image-\d+$/.test(x));
          if (!c) return;
          if (!clsMap.has(c)) clsMap.set(c, theirs.has(c) ? avatarClassFor(theirs.get(c)) : null);
          a.classList.remove(c);
          if (clsMap.get(c)) a.classList.add(clsMap.get(c));
        });
      }
      addTools(n); wrap.appendChild(n); added++;
    });
  });
  if (F.name === 'new') syncAvatarStyle();
  if (opts.sort) sortAndDivide(wrap);
  applyEditable();
  const nMsg = idoc.querySelectorAll(`${F.wrap} > ${F.msg}`).length;
  note = infos.length ? `已加入 ${infos.length} 個檔案（新增 ${added} 個項目${skipped ? `，略過重複 ${skipped} 則` : ''}），共 ${nMsg} 則` : '';
  pushUndo(() => wrap.replaceChildren(...before));
}

/* ---------- 依時間排序 + 重建日期分隔線 ---------- */
function newDivider(key){
  const [y, m, d] = key.split('-');
  const el = idoc.createElement('div');
  el.className = F.div.slice(1); el.textContent = `${y}年${m}月${d}日`;
  if (F.name === 'new') el.setAttribute('data-date', key);
  addTools(el); return el;
}
function sortAndDivide(wrap){
  const kids = [...wrap.children], pool = new Map(), items = [];
  kids.forEach((u, i) => {
    if (u.matches(F.div)){
      const k = dividerKey(u);
      if (k){ const c = pool.get(k); if (!c || (u.hasAttribute('data-toc') && !c.hasAttribute('data-toc'))) pool.set(k, u); return; }
    }
    items.push({ u, i, src: u.__src || 0, st: stampOf(u) });
  });
  // 沒有時間的項目（例如系統訊息）：跟著同檔案相鄰的那則走
  let prev = null;
  items.forEach(it => { if (it.st) prev = it; else if (prev && prev.src === it.src) it.st = prev.st; });
  let nxt = null;
  for (let j = items.length - 1; j >= 0; j--){ const it = items[j]; if (it.st) nxt = it; else if (nxt && nxt.src === it.src) it.st = nxt.st; }
  prev = null;
  items.forEach(it => { if (it.st) prev = it; else if (prev) it.st = prev.st; });
  items.forEach(it => { if (!it.st) it.st = { t: 0, key: null }; });

  items.sort((a, b) => a.st.t - b.st.t || a.src - b.src || a.i - b.i);
  const out = []; let last = null;
  items.forEach(it => {
    const k = it.st.t ? new Date(it.st.t - dayCutoff() * 3600000).toISOString().slice(0, 10) : null;
    if (k && k !== last){ out.push(pool.get(k) || newDivider(k)); pool.delete(k); last = k; }
    // 新版格式：訊息的 data-date 要跟所屬的日期分隔線一致（頻道篩選靠它顯示／隱藏日期）
    if (k && F.name === 'new' && it.u.hasAttribute('data-date')) it.u.setAttribute('data-date', k);
    out.push(it.u);
  });
  wrap.replaceChildren(...out);
}
function sortNow(){
  if (!idoc) return;
  const wrap = idoc.querySelector(F.wrap), before = [...wrap.children];
  sortAndDivide(wrap); applyEditable();
  pushUndo(() => wrap.replaceChildren(...before));
}

/* ---------- 匯入流程（開啟／加入／拖放） ---------- */
async function startImport(files, forced){
  files = [...files].filter(f => /\.html?$/i.test(f.name) || f.type === 'text/html');
  if (!files.length){ alert('請選擇 .html 檔案。'); return; }
  setStatus('讀取中…');
  const infos = [];
  for (const f of files) infos.push(await parseFile(f));   // 一個一個讀，避免記憶體暴衝
  let good = infos.filter(i => i.ok);
  if (!good.length){ alert('找不到對話內容，這些檔案可能不是這個編輯器支援的格式。'); refreshUI(); if (!idoc) setStatus('尚未載入檔案'); return; }
  good.sort((a, b) => a.t0 - b.t0);
  const mode = forced || (idoc ? null : 'replace');

  // 格式不同的檔案沒辦法混在一起
  const baseName = () => (mode === 'add' ? F.name : good[0].F.name);
  if (mode !== null){
    const bn = baseName();
    infos.forEach(i => { if (i.ok && i.F.name !== bn){ i.ok = false; i.why = '格式和其他檔案不同，會略過'; } });
    good = infos.filter(i => i.ok).sort((a, b) => a.t0 - b.t0);
    if (!good.length){ alert('這些檔案的格式和目前的不同，沒辦法合併。'); refreshUI(); return; }
  }

  if (mode === 'replace' && good.length === 1 && infos.length === 1){
    if (idoc && dirty && !confirm('目前的修改還沒匯出，確定要換檔案嗎？')){ refreshUI(); return; }
    loadFresh(good[0]); return;
  }

  // 顯示確認視窗
  $('#impTitle').textContent = mode === 'add' ? `加入 ${good.length} 個檔案` : `載入 ${good.length} 個檔案`;
  const list = $('#impList'); list.innerHTML = '';
  infos.forEach(i => {
    const d = document.createElement('div'); d.className = 'improw' + (i.ok ? '' : ' bad');
    const nm = document.createElement('div'); nm.textContent = i.name;
    const sm = document.createElement('small');
    sm.textContent = i.ok ? `${i.count} 則　${i.range}　（${i.F.label}）` : (i.why || '格式不符，會略過');
    d.append(nm, sm); list.appendChild(d);
  });
  $('#impMode').style.display = mode ? 'none' : 'flex';
  $('#impSort').checked = true; $('#impDup').checked = true;
  const cutoffOf = () => String(good[0].F.cutoff === undefined ? dayCutoff() : dayCutoff()).padStart(2, '0');
  $('#impSortTxt').textContent = `依時間排序，並重新產生日期分隔線（換日時間：${cutoffOf()}:00，可在工具列調整）`;
  $('#impGo').textContent = '載入';
  $('#impCancel').onclick = () => { closeOv('ovImp'); refreshUI(); if (!idoc) setStatus('尚未載入檔案'); };
  $('#impGo').onclick = () => {
    const m = mode || document.querySelector('input[name=impm]:checked').value;
    const opts = { sort: $('#impSort').checked, dedupe: $('#impDup').checked };
    // 沒有事先指定模式時（拖放），到這裡才知道要以哪種格式為準
    const bn = m === 'add' ? F.name : good[0].F.name;
    const usable = good.filter(i => i.F.name === bn);
    if (!usable.length){ alert('這些檔案的格式和目前的不同，沒辦法加入。'); return; }
    if (m === 'replace' && idoc && dirty && !confirm('目前的修改還沒匯出，確定要取代嗎？')) return;
    closeOv('ovImp');
    setStatus('合併中…');
    setTimeout(() => {
      if (m === 'replace'){
        loadFresh(usable[0]);
        if (usable.length > 1){
          const base = usable[0].name.replace(/_part\d+(?=\.html?$)/i, '');
          fileName = base !== usable[0].name ? base : '合併團錄.html';
        }
        mergeInfos(usable.slice(1), opts);
        if (usable.length === 1 && opts.sort) sortNow();
        undoStack.length = 0; dirty = usable.length > 1; refreshUI();
      } else {
        mergeInfos(usable, opts);
      }
      renderToc(); refreshUI();
    }, 30);
  };
  openOv('ovImp');
}

function setupEditor(){
  const style = idoc.createElement('style');
  style.id = 'ed-style'; style.textContent = edCss();
  idoc.head.appendChild(style);
  idoc.documentElement.dataset.ed = 'on';
  idoc.querySelectorAll(F.wrap + ' > *').forEach(addTools);
  editing = true; applyEditable();
  syncModeButtons(); syncThemeButtons();

  lastUnit = null; selAnchor = null; selRefresh();
  const track = e => { const t = e.target; if (!t.closest || t.closest('.ed-tools,.ed-handle')) return; const u = t.closest(F.wrap + ' > *'); if (u) lastUnit = u; };
  idoc.addEventListener('pointerdown', track); idoc.addEventListener('focusin', track);
  idoc.addEventListener('keydown', onKey);
  idoc.addEventListener('paste', onPaste);
  idoc.addEventListener('input', e => {
    const cd = e.target.closest && e.target.closest('.custom-divider');

/* ---------- 每則訊息的把手與工具 ---------- */
function addTools(unit){
  unit.querySelectorAll(':scope > .ed-handle, :scope > .ed-tools').forEach(n => n.remove());
  const h = idoc.createElement('div');
  h.className = 'ed-handle'; h.textContent = '⠿'; h.title = '拖曳以移動';
  h.setAttribute('contenteditable', 'false');
  const t = idoc.createElement('div');
  t.className = 'ed-tools'; t.setAttribute('contenteditable', 'false');
  const on = unit.hasAttribute('data-toc');
  t.innerHTML = `<span class="ed-pick" title="選取起來，可以和其他訊息一起拖曳">☑ 選取</span><span class="ed-addm" title="在這則後面新增一則對話">＋對話</span><span class="ed-addd" title="在這則後面新增文字分隔線">＋分隔線</span><span class="ed-toc${on ? ' on' : ''}">${on ? '★ 移出目錄' : '☰ 目錄'}</span><span class="ed-dup">⧉ 複製</span><span class="ed-del">✕ 刪除</span>`;
  unit.append(h, t);

function onToolClick(e){
  const av = editing && e.target.closest && e.target.closest(each(F.av, a => `${F.wrap} > ${F.msg} > ${a}`));
  if (av){ pendingAv = av.parentNode; $('#avFile').click(); return; }
  const el = e.target.closest && e.target.closest('.ed-dup,.ed-del,.ed-toc,.ed-pick,.ed-addm,.ed-addd');
  if (!el) return;
  const unit = el.closest(F.wrap + ' > *');
  if (!unit) return;
  if (el.classList.contains('ed-pick')){ selToggle(unit); selAnchor = unit; return; }
  if (el.classList.contains('ed-addm')){ addMessage(unit); return; }
  if (el.classList.contains('ed-addd')){ addDivider(unit); return; }
  if (el.classList.contains('ed-toc')){
    if (unit.hasAttribute('data-toc')) setChapter(unit, null);
    else { setChapter(unit, defaultTitle(unit), true); }
    return;
  }
  if (el.classList.contains('ed-del')){
    const parent = unit.parentNode, next = unit.nextSibling;
    unit.remove();
    pushUndo(() => parent.insertBefore(unit, next && next.parentNode === parent ? next : null));
  } else {
    const clone = unit.cloneNode(true);
    clone.classList.remove('ed-dragging','ed-drop-b','ed-drop-a','ed-sel');
    clone.removeAttribute('data-toc'); clone.removeAttribute('data-toc-lv'); clone.removeAttribute('id');
    addTools(clone);

    pushUndo(() => clone.remove());

/* ---------- 選取多則 ---------- */
const selList = () => idoc ? [...idoc.querySelectorAll(F.wrap + ' > .ed-sel')] : [];
function selRefresh(){
  const n = selList().length;

}
function selToggle(u, on){ u.classList.toggle('ed-sel', on === undefined ? !u.classList.contains('ed-sel') : on); selRefresh(); }
function selClear(){ selList().forEach(u => u.classList.remove('ed-sel')); selRefresh(); }
function selRange(wrap, a, b){
  const kids = [...wrap.children]; let i = kids.indexOf(a), j = kids.indexOf(b);
  if (i < 0 || j < 0) return; if (i > j) [i, j] = [j, i];
  for (let k = i; k <= j; k++) kids[k].classList.add('ed-sel');

function selDelete(){
  const list = selList(); if (!list.length) return;

/* ---------- 拖曳排序（滑鼠、觸控都可；選取多則時一起搬） ---------- */
function onPointerDown(e){
  const h = e.target.closest && e.target.closest('.ed-handle');
  if (!h || e.button > 0) return;
  const unit = h.parentNode, wrap = unit.parentNode, win = idoc.defaultView;
  e.preventDefault();
  // Ctrl／⌘ + 點把手：加入或取消選取；Shift + 點把手：選取一個範圍
  if (e.ctrlKey || e.metaKey){ selToggle(unit); selAnchor = unit; return; }
  if (e.shiftKey && selAnchor && selAnchor.isConnected){ selRange(wrap, selAnchor, unit); return; }
  if (!unit.classList.contains('ed-sel')) selClear();
  const moving = unit.classList.contains('ed-sel') ? selList() : [unit];
  selAnchor = unit;
  if (h.setPointerCapture) h.setPointerCapture(e.pointerId);
  const before = [...wrap.children];
  moving.forEach(u => u.classList.add('ed-dragging'));
  idoc.documentElement.classList.add('ed-drag');

  let marked = null, dest = null, lastY = e.clientY, vy = 0, raf = 0;

  const clearMark = () => { if (marked){ marked.classList.remove('ed-drop-b','ed-drop-a'); marked = null; } };
  const locate = () => {
    clearMark(); dest = undefined;
    const items = [...wrap.children].filter(c => !moving.includes(c));
    if (!items.length) return;
    for (const c of items){
      const r = c.getBoundingClientRect();
      if (lastY < r.top + r.height / 2){ dest = c; c.classList.add('ed-drop-b'); marked = c; return; }
    }
    dest = null; const last = items[items.length - 1];
    last.classList.add('ed-drop-a'); marked = last;
  };
  const tick = () => { if (vy){ win.scrollBy(0, vy); locate(); } raf = requestAnimationFrame(tick); };
  raf = requestAnimationFrame(tick);

  const move = ev => {
    lastY = ev.clientY;
    const edge = 70, H = win.innerHeight;
    vy = lastY < edge ? -(edge - lastY) / 2.5 : lastY > H - edge ? (lastY - (H - edge)) / 2.5 : 0;
    locate();
  };
  const end = ev => {
    cancelAnimationFrame(raf);
    h.removeEventListener('pointermove', move);
    h.removeEventListener('pointerup', end);
    h.removeEventListener('pointercancel', end);
    clearMark();
    moving.forEach(u => u.classList.remove('ed-dragging'));
    idoc.documentElement.classList.remove('ed-drag');
    if (ev.type !== 'pointercancel' && dest !== undefined){
      moving.forEach(u => wrap.insertBefore(u, dest));          // 依原本的先後順序一起放到新位置
      const after = [...wrap.children];
      if (after.some((u, i) => u !== before[i])) pushUndo(() => wrap.replaceChildren(...before));
    }
  };
  h.addEventListener('pointermove', move);
  h.addEventListener('pointerup', end);
  h.addEventListener('pointercancel', end);
  move(e);
}

/* ---------- 新增對話／文字分隔線 ---------- */
function insertionPoint(ref){
  const wrap = idoc.querySelector(F.wrap);

function addMessage(ref){

  let m = at; while (m && !m.matches(F.msg)) m = m.previousElementSibling;
  if (!m) m = wrap.querySelector(':scope > ' + F.msg);
  if (!m) return hint('找不到可以當範本的對話');
  const n = m.cloneNode(true);
  n.querySelectorAll('.ed-handle,.ed-tools').forEach(x => x.remove());
  ['id', 'data-toc', 'data-toc-lv'].forEach(a => n.removeAttribute(a));
  n.classList.remove('ed-dragging', 'ed-drop-b', 'ed-drop-a', 'ed-flash', 'ed-sel');
  const body = n.querySelector(F.body), head = body && body.querySelector(F.head);
  if (!body || !head) return hint('這則對話的結構認不出來，沒辦法當範本');

  if (!tx){ tx = idoc.createElement('div'); tx.className = 'tx'; body.appendChild(tx); }
  tx.textContent = '新訊息';

  lastUnit = n;
  pushUndo(() => n.remove());

function addDivider(ref){

  addTools(el);
  if (at) at.after(el); else wrap.appendChild(el);
  lastUnit = el;
  pushUndo(() => el.remove());

/* ---------- 文字編輯 ---------- */
function applyEditable(){
  idoc.querySelectorAll(EDITABLE).forEach(n => {
    if (n.closest('.ed-tools')) return;
    if (editing) n.setAttribute('contenteditable', 'true'); else n.removeAttribute('contenteditable');

function onKey(e){

  const t = e.target;

  const ex = ancestorOf(c, sp.sel);
  if (ex) return withUndo(c, () => unwrapInline(ex));
  const make = () => { const e = idoc.createElement(sp.tag); if (sp.cls) e.className = sp.cls; return e; };
  if (c.r.collapsed){
    if (!sp.prefix) return hint('請先選取要套用的文字');
    const name = prompt(kind === 'mention' ? '要提及誰？（輸入名字）' : '要提及哪個頻道？（輸入名稱）'); if (!name || !name.trim()) return;
    return withUndo(c, () => { const e = make(); e.textContent = sp.prefix + name.trim().replace(/^[@#]/, ''); c.r.insertNode(e); caretIn(c, e); });
  }

function fmtLink(){
  const c = curTx(); if (!c) return hint('請先選取要加上連結的文字');

}
function fmtList(ordered){
  const c = curTx(); if (!c) return hint('請先點進一則訊息的內文，再按格式按鈕');
  const lines = getLines(c); if (!lines.length) return;
  const tag = ordered ? 'ol' : 'ul';
  const one = lines.length === 1 && lines[0].block && /^(UL|OL)$/.test(lines[0].block.tagName) ? lines[0].block : null;

    else { const n = idoc.createElement(tag); n.className = 'md-list'; while (one.firstChild) n.appendChild(one.firstChild); one.replaceWith(n); }
  });

const STRIP = 'strong,b,em,i,u,s,strike,del,code,a,font,mark,span.spoiler,span.dc-sub,span.mention,span.mention-ch';
function fmtClear(){
  const c = curTx(); if (!c) return hint('請先點進一則訊息的內文，再按格式按鈕');
  const lines = getLines(c); if (!lines.length) return;
  withUndo(c, () => {
    const kids = c.kids, first = kids[lines[0].first], last = kids[lines[lines.length - 1].last];
    const m1 = idoc.createComment('s'), m2 = idoc.createComment('e'); first.before(m1); last.after(m2);
    lines.forEach(l => { if (l.block) (/^(UL|OL)$/.test(l.block.tagName) ? unwrapList(l.block) : unwrapEl(l.block)); });

    list.forEach(n => { if (n.nodeType !== 1) return; [...n.querySelectorAll(STRIP)].reverse().forEach(unwrapInline); if (n.matches(STRIP)) unwrapInline(n); });

async function fileToAvatar(file){
  const url = URL.createObjectURL(file);
  try {
    const img = new Image(); img.src = url; await img.decode();
    const S = 160, c = document.createElement('canvas'); c.width = c.height = S;
    const w = img.naturalWidth, h = img.naturalHeight, m = Math.min(w, h);
    c.getContext('2d').drawImage(img, (w - m) / 2, (h - m) / 2, m, m, 0, 0, S, S);
    let u = c.toDataURL('image/webp', .88);
    if (!u.startsWith('data:image/webp')) u = c.toDataURL('image/jpeg', .9);
    return u;
  } finally { URL.revokeObjectURL(url); }
}
const avChild = u => u.querySelector(each(F.av, a => ':scope > ' + a));
function makeAvatar(url){
  if (F.name === 'new'){
    const d = idoc.createElement('div');
    d.className = 'avatar ' + avatarClassFor(url); d.setAttribute('aria-hidden', 'true');
    return d;
  }

}
function applyAvatar(units, url){

  pushUndo(() => swaps.forEach(([o, n]) => o ? n.replaceWith(o) : n.remove()));
}

  }
}

$('#btnOpen').onclick = () => $('#file').click();
$('#file').onchange = e => { const f = [...e.target.files]; e.target.value = ''; if (f.length) startImport(f, 'replace'); };
$('#btnAdd').onclick = () => $('#fileAdd').click();
$('#fileAdd').onchange = e => { const f = [...e.target.files]; e.target.value = ''; if (f.length) startImport(f, 'add'); };
$('#btnSort').onclick = sortNow;
$('#btnAddMsg').onclick = () => addMessage(null);
$('#btnAddDiv').onclick = () => addDivider(null);
$('#selClear').onclick = selClear;
$('#selDel').onclick = selDelete;
['btnAddMsg', 'btnAddDiv', 'selClear', 'selDel'].forEach(id => $('#' + id).addEventListener('mousedown', e => e.preventDefault()));
$('#thDark').onclick = () => setTheme('dark');
$('#thLight').onclick = () => setTheme('light');
$('#mEdit').onclick = () => setMode(true);
$('#mView').onclick = () => setMode(false);
$('#btnUndo').onclick = undo;
$('#btnExport').onclick = openExport;
$('#exGo').onclick = doExport;
$('#exCancel').onclick = () => closeOv('ovExport');
$('#exDark').onclick = () => { exOpts.theme = 'dark'; syncExTheme(); };
$('#exLight').onclick = () => { exOpts.theme = 'light'; syncExTheme(); };
$('#btnToc').onclick = () => $('#tocPanel').classList.toggle('open');
$('#tocClose').onclick = () => $('#tocPanel').classList.remove('open');
$('#tocDates').onclick = addAllDates;
$('#tocClear').onclick = clearToc;
$('#avFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f || !pendingAv) return;
  try { showAvatarDialog(await fileToAvatar(f)); } catch (err){ alert('這張圖片無法讀取，請換一張試試。'); }
};
document.querySelectorAll('.ov').forEach(o => o.addEventListener('mousedown', e => { if (e.target === o) o.classList.remove('open'); }));
// 按工具列按鈕時不搶走文字選取
document.querySelectorAll('#btnB,#btnI,[data-f]').forEach(b => b.addEventListener('mousedown', e => e.preventDefault()));
document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { if (!idoc) return hint('請先開啟檔案'); if (!editing) return hint('預覽模式下無法編輯，請切回「編輯」'); FMT[b.dataset.f](); });
$('#btnB').onclick = () => fmt('bold');
$('#btnI').onclick = () => fmt('italic');

const empty = $('#empty');
window.addEventListener('dragover', e => { e.preventDefault(); empty.classList.add('over'); });
window.addEventListener('dragleave', () => empty.classList.remove('over'));
window.addEventListener('drop', e => {
  e.preventDefault(); empty.classList.remove('over');
  if (e.dataTransfer.files.length) startImport(e.dataTransfer.files, null);
});
window.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's'){ e.preventDefault(); openExport(); }
});
window.addEventListener('beforeunload', e => { if (dirty){ e.preventDefault(); e.returnValue = ''; } });
</script>
</body>
</html>
